name: calculator
on:
  push:
    paths: ['src/Calc/**', 'tests/CalcTests/**', '.github/workflows/calculator.yml']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet run --project tests/CalcTests
      - run: dotnet publish src/Calc/Calc.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o out
      - uses: actions/upload-artifact@v4
        with: { name: Calculator, path: out/Calculator.exe }
